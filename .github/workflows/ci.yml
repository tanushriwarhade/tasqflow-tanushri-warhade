name: Tasqflow Enterprise CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-backend-api:
    runs-on: ubuntu-latest
    steps:
      - name: Codebase pull
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install server dependencies
        run: |
          cd backend
          npm ci

      - name: Code checks and Syntax lint
        run: |
          cd backend
          npm run build

      - name: Run server unit tests
        run: |
          cd backend
          npm test

  audit-frontend-app:
    runs-on: ubuntu-latest
    steps:
      - name: Codebase pull
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install NextJS dependencies
        run: |
          cd frontend
          npm ci

      - name: Enterprise package build
        run: |
          cd frontend
          npm run build
