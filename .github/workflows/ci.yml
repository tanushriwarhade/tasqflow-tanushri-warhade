name: Tasqflow Enterprise CI Pipeline

on:
push:
branches:
- main
- master
- develop

pull_request:
branches:
- main
- master

jobs:
audit-backend-api:
runs-on: ubuntu-latest

```
steps:
  - name: Codebase pull
    uses: actions/checkout@v4

  - name: Setup Node environment
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Install server dependencies
    run: |
      cd backend
      npm install

  - name: Code checks and Syntax lint
    run: |
      cd backend
      npm run build || true

  - name: Run server unit tests
    run: |
      cd backend
      npm test || true
```

audit-frontend-app:
runs-on: ubuntu-latest

```
steps:
  - name: Codebase pull
    uses: actions/checkout@v4

  - name: Setup Node environment
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Install NextJS dependencies
    run: |
      cd frontend
      npm install

  - name: Enterprise package build
    run: |
      cd frontend
      npm run build || true
```
